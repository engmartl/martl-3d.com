<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سورة الفاتحة | Martl 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#D4AF37;--gold2:#F5E27A;--green:#00C853;--dark:#04080f;--dark2:#070f1a;--dark3:#0a1520;
    --border:rgba(212,175,55,0.2);--white:#fff;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Cairo',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;overflow-x:hidden;direction:rtl}

  /* Stars background */
  #stars-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .star{position:absolute;background:white;border-radius:50%;animation:twinkle ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.05}to{opacity:.6}}

  /* Gradient bg */
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,100,50,0.15) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 50% 100%,rgba(212,175,55,0.08) 0%,transparent 60%);pointer-events:none;z-index:0}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:14px 5%;background:rgba(4,8,15,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
  .logo{font-family:'Cairo',sans-serif;font-size:20px;font-weight:900;background:linear-gradient(90deg,#FF4E8E,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
  .back-link{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.5);text-decoration:none;font-size:14px;font-weight:700;transition:color .2s}
  .back-link:hover{color:var(--gold)}
  .nav-center{font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;color:rgba(255,255,255,.7)}

  /* MAIN LAYOUT */
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:90px 4% 40px}

  /* SURAH HEADER */
  .surah-header{text-align:center;margin-bottom:36px;padding:28px 40px;background:rgba(212,175,55,0.06);border:1px solid var(--border);border-radius:28px;max-width:600px;width:100%}
  .surah-icon{font-size:48px;margin-bottom:10px;display:block;filter:drop-shadow(0 2px 12px rgba(212,175,55,.4))}
  .surah-name{font-family:'Amiri',serif;font-size:38px;color:var(--gold);margin-bottom:4px}
  .surah-sub{font-size:14px;color:rgba(255,255,255,.45);font-weight:600}
  .surah-count{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);padding:5px 16px;border-radius:50px;font-size:13px;color:var(--gold);font-weight:700}

  /* PROGRESS */
  .progress-wrap{width:100%;max-width:600px;margin-bottom:28px}
  .progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .progress-label{font-size:13px;color:rgba(255,255,255,.45);font-weight:700}
  .progress-num{font-size:13px;color:var(--gold);font-weight:700}
  .progress-bar{height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:6px;transition:width .5s ease}

  /* AYAH CARD */
  .ayah-card{width:100%;max-width:720px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}

  /* Ayah number badge */
  .ayah-num-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 28px;background:rgba(212,175,55,.07);border-bottom:1px solid var(--border)}
  .ayah-num-badge{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#a07c20);display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-size:16px;color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(212,175,55,.3)}
  .ayah-num-label{font-size:14px;color:rgba(255,255,255,.55);font-weight:700}

  /* Words area */
  .words-area{padding:36px 28px 28px;text-align:center;min-height:160px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 6px;direction:rtl}

  .word-btn{
    font-family:'Amiri Quran','Amiri',serif;
    font-size:clamp(26px,4vw,36px);
    color:var(--white);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:10px 18px;
    cursor:pointer;
    transition:all .25s;
    line-height:1.8;
    position:relative;
  }
  .word-btn:hover{background:rgba(212,175,55,.15);border-color:rgba(212,175,55,.4);transform:translateY(-2px)}
  .word-btn.hidden{
    color:transparent!important;
    background:rgba(212,175,55,.12);
    border-color:rgba(212,175,55,.3);
    cursor:pointer;
    min-width:60px;
  }
  .word-btn.hidden::after{
    content:'؟';
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:20px;color:rgba(212,175,55,.6);font-family:'Cairo',sans-serif;
  }
  .word-btn.just-revealed{animation:revealPop .3s ease}
  @keyframes revealPop{0%{transform:scale(0.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

  /* Translation */
  .translation{display:none}

  /* Controls */
  .controls{padding:20px 28px 28px;display:flex;flex-direction:column;gap:12px}
  .ctrl-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  .btn{font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;padding:12px 24px;border-radius:50px;border:none;cursor:pointer;transition:transform .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px)}

  .btn-show-all{background:linear-gradient(135deg,var(--green),#00897B);color:white;box-shadow:0 4px 16px rgba(0,200,83,.25)}
  .btn-hide-all{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.12)}
  .btn-next{background:linear-gradient(135deg,var(--gold),#a07c20);color:#0a0a0a;font-size:16px;padding:14px 36px;box-shadow:0 6px 20px rgba(212,175,55,.3);font-weight:900}
  .btn-prev{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1);font-size:14px}

  /* Navigation dots */
  .ayah-dots{display:flex;gap:8px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  .dot{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);cursor:pointer;transition:all .2s;font-family:'Cairo',sans-serif}
  .dot:hover{background:rgba(212,175,55,.2);border-color:rgba(212,175,55,.4);color:var(--gold)}
  .dot.active{background:linear-gradient(135deg,var(--gold),#a07c20);border-color:var(--gold);color:#0a0a0a;box-shadow:0 3px 12px rgba(212,175,55,.35)}
  .dot.done{background:rgba(0,200,83,.2);border-color:rgba(0,200,83,.4);color:var(--green)}

  /* Completion screen */
  #complete-screen{display:none;position:fixed;inset:0;z-index:300;background:rgba(4,8,15,.95);flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px}
  #complete-screen.show{display:flex}
  .complete-icon{font-size:80px;animation:bounceIn .6s ease}
  @keyframes bounceIn{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .complete-title{font-family:'Amiri',serif;font-size:52px;color:var(--gold);text-shadow:0 2px 20px rgba(212,175,55,.4)}
  .complete-sub{font-size:18px;color:rgba(255,255,255,.6);font-weight:600;line-height:1.7}
  .btn-restart{background:linear-gradient(135deg,var(--gold),#a07c20);color:#0a0a0a;font-size:18px;padding:16px 48px;border-radius:50px;border:none;cursor:pointer;font-weight:900;font-family:'Cairo',sans-serif;box-shadow:0 8px 24px rgba(212,175,55,.35);margin-top:8px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:301}
  .cp{position:absolute;border-radius:2px;animation:cpFall linear forwards}
  @keyframes cpFall{from{transform:translateY(-10px) rotate(0);opacity:1}to{transform:translateY(105vh) rotate(540deg);opacity:0}}
</style>
</head>
<body>

<div id="stars-bg"></div>

<!-- Completion screen -->
<div id="complete-screen">
  <div id="confetti"></div>
  <div class="complete-icon">🌙</div>
  <div class="complete-title">ما شاء الله!</div>
  <div class="complete-sub">لقد أتممت سورة الفاتحة كاملة 🎉<br>بارك الله فيك وجعلها في ميزان حسناتك</div>
  <button class="btn-restart" onclick="restartAll()">🔄 ابدأ من جديد</button>
  <a href="../quran/index.html" style="color:rgba(255,255,255,.4);text-decoration:none;font-size:14px;font-weight:700;margin-top:4px">← العودة للقرآن</a>
</div>

<nav>
  <a class="back-link" href="../quran/index.html">← القرآن الكريم</a>
  <div class="nav-center">📖 سورة الفاتحة</div>
  <a class="logo" href="../index.html">Martl 3D</a>
</nav>

<main>
  <!-- Surah header -->
  <div class="surah-header">
    <span class="surah-icon">🕌</span>
    <div class="surah-name">سورة الفاتحة</div>
    <div class="surah-sub">مكية • ٧ آيات • الجزء الأول</div>
    <div class="surah-count">﴿ بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ﴾</div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-info">
      <span class="progress-label">تقدمك في الحفظ</span>
      <span class="progress-num" id="progress-text">الآية ١ من ٧</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:14%"></div></div>
  </div>

  <!-- Ayah card -->
  <div class="ayah-card">
    <div class="ayah-num-bar">
      <div class="ayah-num-badge" id="ayah-num">١</div>
      <div class="ayah-num-label" id="ayah-num-label">الآية الأولى</div>
    </div>
    <div class="words-area" id="words-area"></div>
    <div class="translation" id="translation"></div>
    <div class="controls">
      <div class="ctrl-row">
        <button class="btn btn-show-all" onclick="showAll()">👁️ اظهر الكل</button>
        <button class="btn btn-hide-all" onclick="hideAll()">🙈 اخفي الكل</button>
      </div>
      <div class="ctrl-row">
        <button class="btn btn-prev" id="btn-prev" onclick="prevAyah()">→ السابقة</button>
        <button class="btn btn-next" id="btn-next" onclick="nextAyah()">التالية ←</button>
      </div>
    </div>
  </div>

  <!-- Dots navigation -->
  <div class="ayah-dots" id="ayah-dots"></div>
</main>

<script>
// ── DATA ──────────────────────────────────────────
const AYAHS = [
  {
    num: '١', label: 'الآية الأولى',
    words: ['بِسْمِ', 'اللَّهِ', 'الرَّحْمَٰنِ', 'الرَّحِيمِ'],
    translation: 'In the name of Allah, the Most Gracious, the Most Merciful'
  },
  {
    num: '٢', label: 'الآية الثانية',
    words: ['الْحَمْدُ', 'لِلَّهِ', 'رَبِّ', 'الْعَالَمِينَ'],
    translation: 'All praise is due to Allah, Lord of the worlds'
  },
  {
    num: '٣', label: 'الآية الثالثة',
    words: ['الرَّحْمَٰنِ', 'الرَّحِيمِ'],
    translation: 'The Most Gracious, the Most Merciful'
  },
  {
    num: '٤', label: 'الآية الرابعة',
    words: ['مَالِكِ', 'يَوْمِ', 'الدِّينِ'],
    translation: 'Master of the Day of Judgment'
  },
  {
    num: '٥', label: 'الآية الخامسة',
    words: ['إِيَّاكَ', 'نَعْبُدُ', 'وَإِيَّاكَ', 'نَسْتَعِينُ'],
    translation: 'It is You we worship and You we ask for help'
  },
  {
    num: '٦', label: 'الآية السادسة',
    words: ['اهْدِنَا', 'الصِّرَاطَ', 'الْمُسْتَقِيمَ'],
    translation: 'Guide us to the straight path'
  },
  {
    num: '٧', label: 'الآية السابعة',
    words: ['صِرَاطَ', 'الَّذِينَ', 'أَنْعَمْتَ', 'عَلَيْهِمْ', 'غَيْرِ', 'الْمَغْضُوبِ', 'عَلَيْهِمْ', 'وَلَا', 'الضَّالِّينَ'],
    translation: 'The path of those upon whom You have bestowed favor, not of those who have evoked anger or of those who are astray'
  }
];

const LABELS = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة'];
let current = 0;
let hiddenState = []; // true = hidden
let done = [];        // completed ayahs

// ── STARS ──────────────────────────────────────────
(function(){
  const c = document.getElementById('stars-bg');
  for(let i=0;i<60;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.5+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${1.5+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
    c.appendChild(s);
  }
})();

// ── INIT ──────────────────────────────────────────
function init() {
  buildDots();
  loadAyah(0);
}

function buildDots() {
  const wrap = document.getElementById('ayah-dots');
  wrap.innerHTML = '';
  AYAHS.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i===current?' active':'') + (done.includes(i)?' done':'');
    d.textContent = a.num;
    d.onclick = () => loadAyah(i);
    wrap.appendChild(d);
  });
}

function loadAyah(idx) {
  current = idx;
  const ayah = AYAHS[idx];
  hiddenState = ayah.words.map(() => true); // all hidden by default

  // Header
  document.getElementById('ayah-num').textContent = ayah.num;
  document.getElementById('ayah-num-label').textContent = ayah.label;
  document.getElementById('translation').textContent = ayah.translation;

  // Progress
  document.getElementById('progress-text').textContent = `الآية ${ayah.num} من ٧`;
  document.getElementById('progress-fill').style.width = ((idx+1)/7*100)+'%';

  // Prev/Next buttons
  document.getElementById('btn-prev').style.opacity = idx===0 ? '0.3' : '1';
  document.getElementById('btn-prev').disabled = idx===0;
  document.getElementById('btn-next').textContent = idx===AYAHS.length-1 ? '🎉 أتممت السورة' : 'التالية ←';

  renderWords();
  buildDots();
}

function renderWords() {
  const area = document.getElementById('words-area');
  area.innerHTML = '';
  const ayah = AYAHS[current];
  ayah.words.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'word-btn' + (hiddenState[i] ? ' hidden' : '');
    btn.textContent = w;
    btn.onclick = () => toggleWord(i);
    area.appendChild(btn);
  });
}

function toggleWord(i) {
  hiddenState[i] = !hiddenState[i];
  const btns = document.querySelectorAll('.word-btn');
  btns[i].classList.toggle('hidden', hiddenState[i]);
  if (!hiddenState[i]) {
    btns[i].classList.add('just-revealed');
    setTimeout(() => btns[i].classList.remove('just-revealed'), 400);
  }
}

function showAll() {
  hiddenState = hiddenState.map(() => false);
  renderWords();
}

function hideAll() {
  hiddenState = hiddenState.map(() => true);
  renderWords();
}

function nextAyah() {
  if (!done.includes(current)) done.push(current);
  if (current >= AYAHS.length - 1) {
    showComplete();
  } else {
    loadAyah(current + 1);
  }
}

function prevAyah() {
  if (current > 0) loadAyah(current - 1);
}

function showComplete() {
  document.getElementById('complete-screen').classList.add('show');
  launchConfetti();
}

function restartAll() {
  done = [];
  document.getElementById('complete-screen').classList.remove('show');
  loadAyah(0);
}

function launchConfetti() {
  const c = document.getElementById('confetti');
  c.innerHTML = '';
  const colors = ['#D4AF37','#F5E27A','#00C853','#fff','#FF4E8E','#2196F3'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div');p.className='cp';
    p.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*1.5}s`;
    c.appendChild(p);
  }
}

init();
</script>
</body>
</html>
