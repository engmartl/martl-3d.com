<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزء عمّ | Martl 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#D4AF37;--green:#00C853;--dark:#04080f;--dark2:#070f1a;--border:rgba(212,175,55,0.2);--white:#fff}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Cairo',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;overflow-x:hidden;direction:rtl}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,80,40,0.12) 0%,transparent 60%);pointer-events:none;z-index:0}
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .star{position:absolute;background:white;border-radius:50%;animation:twinkle ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.04}to{opacity:.55}}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:13px 5%;background:rgba(4,8,15,0.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
  .logo{font-family:'Cairo',sans-serif;font-size:20px;font-weight:900;background:linear-gradient(90deg,#FF4E8E,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
  .back-link{color:rgba(255,255,255,.5);text-decoration:none;font-size:14px;font-weight:700;transition:color .2s}
  .back-link:hover{color:var(--gold)}

  /* MAIN */
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:85px 4% 60px}

  /* HEADER */
  .page-header{text-align:center;margin-bottom:32px;max-width:660px;width:100%}
  .page-icon{font-size:56px;display:block;margin-bottom:12px;filter:drop-shadow(0 2px 16px rgba(212,175,55,.4));animation:float 3s ease-in-out infinite alternate}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
  .page-title{font-family:'Amiri',serif;font-size:44px;color:var(--gold);margin-bottom:6px}
  .page-sub{font-size:14px;color:rgba(255,255,255,.4);font-weight:600}
  .page-badge{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:rgba(212,175,55,.08);border:1px solid var(--border);padding:7px 20px;border-radius:50px;font-size:13px;color:rgba(212,175,55,.8);font-weight:700}

  /* SEARCH */
  .search-wrap{width:100%;max-width:560px;margin-bottom:32px;position:relative}
  .search-input{width:100%;padding:14px 50px 14px 20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:50px;color:var(--white);font-family:'Cairo',sans-serif;font-size:16px;font-weight:600;outline:none;transition:border-color .2s}
  .search-input:focus{border-color:rgba(212,175,55,.5);background:rgba(255,255,255,.08)}
  .search-input::placeholder{color:rgba(255,255,255,.3)}
  .search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
  .search-count{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:12px;color:rgba(255,255,255,.3);font-weight:700}

  /* GRID */
  .surahs-grid{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}

  .surah-card{border-radius:20px;overflow:hidden;border:1px solid var(--border);text-decoration:none;color:inherit;display:block;background:rgba(255,255,255,.03);transition:transform .3s,box-shadow .3s,border-color .3s;position:relative}
  .surah-card:hover{transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,.45);border-color:rgba(212,175,55,.35)}
  .surah-card.hidden-card{display:none}

  .card-cover{height:100px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;overflow:hidden}
  .cover-glow{position:absolute;width:120px;height:120px;border-radius:50%;filter:blur(40px);opacity:.25;left:50%;top:50%;transform:translate(-50%,-50%)}
  .surah-order{font-family:'Amiri',serif;font-size:13px;color:rgba(255,255,255,.3);position:relative;z-index:2}
  .surah-arabic-name{font-family:'Amiri',serif;font-size:30px;position:relative;z-index:2;text-shadow:0 2px 8px rgba(0,0,0,.3)}
  .surah-num-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-size:14px;font-weight:700;position:relative;z-index:2;flex-shrink:0}

  .card-info{padding:12px 16px 14px;border-top:1px solid rgba(255,255,255,.05)}
  .card-name-en{font-size:14px;font-weight:700;margin-bottom:4px}
  .card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .meta-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:50px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);color:rgba(212,175,55,.7)}
  .start-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;padding:8px 18px;border-radius:50px;color:white;transition:transform .2s;text-decoration:none}
  .start-btn:hover{transform:translateY(-2px)}

  /* No results */
  .no-results{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);font-size:16px;font-weight:600;display:none}
  .no-results.show{display:block}

  footer{position:relative;z-index:1;background:rgba(4,8,15,.8);border-top:1px solid var(--border);padding:22px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:40px}
  .footer-logo{font-family:'Cairo',sans-serif;font-size:18px;font-weight:900;background:linear-gradient(90deg,#FF4E8E,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
  .footer-copy{font-size:12px;color:rgba(255,255,255,.2);font-weight:600}
</style>
</head>
<body>
<div id="stars"></div>

<nav>
  <a class="back-link" href="index.html">← القرآن الكريم</a>
  <div style="font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;color:rgba(255,255,255,.7)">📖 جزء عمّ</div>
  <a class="logo" href="../index.html">Martl 3D</a>
</nav>

<main>
  <div class="page-header">
    <span class="page-icon">🌙</span>
    <div class="page-title">جزء عمّ</div>
    <div class="page-sub">الجزء الثلاثون من القرآن الكريم</div>
    <div class="page-badge">📖 ٣٧ سورة • من سورة النبأ إلى سورة الناس</div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" placeholder="ابحث عن سورة..." id="search-input" oninput="filterSurahs(this.value)">
    <span class="search-count" id="search-count">٣٧ سورة</span>
  </div>

  <div class="surahs-grid" id="surahs-grid"></div>
  <div class="no-results" id="no-results">لم يتم العثور على سورة 🔍</div>
</main>

<footer>
  <a class="footer-logo" href="../index.html">Martl 3D 🎮</a>
  <div class="footer-copy">© 2025 Martl 3D</div>
</footer>

<script>
// ══════════════════════════════════════
// DATA — جزء عمّ (37 سورة بالترتيب)
// ══════════════════════════════════════
const SURAHS = [
  { num:78,  order:1,  ar:'النبأ',     en:'An-Naba',      ayahs:40, color:'#4FC3F7', bg:'#040e18', available:false },
  { num:79,  order:2,  ar:'النازعات',  en:'An-Naziat',    ayahs:46, color:'#80CBC4', bg:'#04110f', available:false },
  { num:80,  order:3,  ar:'عبس',       en:'Abasa',        ayahs:42, color:'#A5D6A7', bg:'#060f06', available:false },
  { num:81,  order:4,  ar:'التكوير',   en:'At-Takwir',    ayahs:29, color:'#FFD54F', bg:'#100e02', available:false },
  { num:82,  order:5,  ar:'الانفطار',  en:'Al-Infitar',   ayahs:19, color:'#FFAB76', bg:'#100802', available:false },
  { num:83,  order:6,  ar:'المطففين',  en:'Al-Mutaffifin',ayahs:36, color:'#EF9A9A', bg:'#100404', available:false },
  { num:84,  order:7,  ar:'الانشقاق',  en:'Al-Inshiqaq',  ayahs:25, color:'#CE93D8', bg:'#0c0414', available:false },
  { num:85,  order:8,  ar:'البروج',    en:'Al-Buruj',     ayahs:22, color:'#90CAF9', bg:'#040c18', available:false },
  { num:86,  order:9,  ar:'الطارق',    en:'At-Tariq',     ayahs:17, color:'#80DEEA', bg:'#041014', available:false },
  { num:87,  order:10, ar:'الأعلى',    en:'Al-Ala',       ayahs:19, color:'#C5E1A5', bg:'#080f04', available:false },
  { num:88,  order:11, ar:'الغاشية',   en:'Al-Ghashiyah', ayahs:26, color:'#FFCC80', bg:'#100a02', available:false },
  { num:89,  order:12, ar:'الفجر',     en:'Al-Fajr',      ayahs:30, color:'#FFAB76', bg:'#100602', available:false },
  { num:90,  order:13, ar:'البلد',     en:'Al-Balad',     ayahs:20, color:'#BCB3F7', bg:'#080418', available:false },
  { num:91,  order:14, ar:'الشمس',     en:'Ash-Shams',    ayahs:15, color:'#FFD700', bg:'#100d00', available:false },
  { num:92,  order:15, ar:'الليل',     en:'Al-Layl',      ayahs:21, color:'#90A4AE', bg:'#060810', available:false },
  { num:93,  order:16, ar:'الضحى',     en:'Ad-Duha',      ayahs:11, color:'#FFD54F', bg:'#100e02', available:false },
  { num:94,  order:17, ar:'الشرح',     en:'Ash-Sharh',    ayahs:8,  color:'#80CBC4', bg:'#04110f', available:false },
  { num:95,  order:18, ar:'التين',     en:'At-Tin',       ayahs:8,  color:'#A5D6A7', bg:'#060f06', available:false },
  { num:96,  order:19, ar:'العلق',     en:'Al-Alaq',      ayahs:19, color:'#EF9A9A', bg:'#100404', available:false },
  { num:97,  order:20, ar:'القدر',     en:'Al-Qadr',      ayahs:5,  color:'#FFD700', bg:'#100d00', available:false },
  { num:98,  order:21, ar:'البينة',    en:'Al-Bayyinah',  ayahs:8,  color:'#90CAF9', bg:'#040c18', available:false },
  { num:99,  order:22, ar:'الزلزلة',   en:'Az-Zalzalah',  ayahs:8,  color:'#FFAB76', bg:'#100602', available:false },
  { num:100, order:23, ar:'العاديات',  en:'Al-Adiyat',    ayahs:11, color:'#80DEEA', bg:'#041014', available:false },
  { num:101, order:24, ar:'القارعة',   en:'Al-Qariah',    ayahs:11, color:'#EF9A9A', bg:'#100404', available:false },
  { num:102, order:25, ar:'التكاثر',   en:'At-Takathur',  ayahs:8,  color:'#CE93D8', bg:'#0c0414', available:false },
  { num:103, order:26, ar:'العصر',     en:'Al-Asr',       ayahs:3,  color:'#FFD54F', bg:'#100e02', available:false },
  { num:104, order:27, ar:'الهمزة',    en:'Al-Humazah',   ayahs:9,  color:'#A5D6A7', bg:'#060f06', available:false },
  { num:105, order:28, ar:'الفيل',     en:'Al-Fil',       ayahs:5,  color:'#FFCC80', bg:'#100a02', available:false },
  { num:106, order:29, ar:'قريش',      en:'Quraysh',      ayahs:4,  color:'#FFD700', bg:'#100d00', available:false },
  { num:107, order:30, ar:'الماعون',   en:'Al-Maun',      ayahs:7,  color:'#90CAF9', bg:'#040c18', available:false },
  { num:108, order:31, ar:'الكوثر',    en:'Al-Kawthar',   ayahs:3,  color:'#80DEEA', bg:'#041014', available:false },
  { num:109, order:32, ar:'الكافرون',  en:'Al-Kafirun',   ayahs:6,  color:'#C5E1A5', bg:'#080f04', available:false },
  { num:110, order:33, ar:'النصر',     en:'An-Nasr',      ayahs:3,  color:'#A5D6A7', bg:'#060f06', available:false },
  { num:111, order:34, ar:'المسد',     en:'Al-Masad',     ayahs:5,  color:'#EF9A9A', bg:'#100404', available:false },
  { num:112, order:35, ar:'الإخلاص',   en:'Al-Ikhlas',    ayahs:4,  color:'#90CAF9', bg:'#040c18', available:true,  file:'al-ikhlas.html' },
  { num:113, order:36, ar:'الفلق',     en:'Al-Falaq',     ayahs:5,  color:'#CE93D8', bg:'#0c0414', available:false },
  { num:114, order:37, ar:'الناس',     en:'An-Nas',       ayahs:6,  color:'#FFD700', bg:'#100d00', available:false },
];

// Arabic numerals
function toArabic(n){
  return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
}

// ══════════════════════════════════════
// BUILD CARDS
// ══════════════════════════════════════
function buildGrid(){
  const grid = document.getElementById('surahs-grid');
  grid.innerHTML = '';
  SURAHS.forEach(s => {
    const card = document.createElement(s.available ? 'a' : 'div');
    card.className = 'surah-card';
    card.dataset.name = s.ar + ' ' + s.en;
    if(s.available) card.href = s.file;

    card.innerHTML = `
      <div class="card-cover" style="background:linear-gradient(135deg,${s.bg},${s.bg}dd)">
        <div class="cover-glow" style="background:${s.color}"></div>
        <div class="surah-order" style="z-index:2">${toArabic(s.order)}</div>
        <div class="surah-arabic-name" style="color:${s.color}">${s.ar}</div>
        <div class="surah-num-badge" style="background:rgba(${hexToRgb(s.color)},.15);border:1px solid rgba(${hexToRgb(s.color)},.35);color:${s.color}">${toArabic(s.num)}</div>
      </div>
      <div class="card-info">
        <div class="card-name-en" style="color:${s.color}">${s.en}</div>
        <div class="card-meta">
          <span class="meta-pill">${toArabic(s.ayahs)} آية</span>
          <span class="meta-pill">مكية</span>
          ${s.available ? '<span class="meta-pill" style="background:rgba(0,200,83,.1);border-color:rgba(0,200,83,.3);color:#00C853">✅ متاحة</span>' : ''}
        </div>
        ${s.available
          ? `<span class="start-btn" style="background:linear-gradient(135deg,${s.color}88,${s.color}44);color:${s.color};border:1px solid ${s.color}44">▶ ابدأ الحفظ</span>`
          : `<span style="font-size:12px;color:rgba(255,255,255,.25);font-weight:700">🔒 قريباً</span>`
        }
      </div>`;
    grid.appendChild(card);
  });
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

// ══════════════════════════════════════
// SEARCH
// ══════════════════════════════════════
function filterSurahs(q){
  const term = q.trim().toLowerCase();
  const cards = document.querySelectorAll('.surah-card');
  let visible = 0;
  cards.forEach(c => {
    const name = c.dataset.name.toLowerCase();
    const match = !term || name.includes(term);
    c.classList.toggle('hidden-card', !match);
    if(match) visible++;
  });
  document.getElementById('search-count').textContent = toArabic(visible) + ' سورة';
  document.getElementById('no-results').classList.toggle('show', visible === 0);
}

// ══════════════════════════════════════
// STARS
// ══════════════════════════════════════
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<55;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.5+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${1.5+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
    c.appendChild(s);
  }
})();

buildGrid();
</script>
</body>
</html>
